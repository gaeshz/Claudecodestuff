<title>The CMT Briefing</title>
<meta name="description" content="A daily curated intelligence briefing for communications, media, technology and high-tech." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />

<style>
  :root {
    --paper:      #f3f4f1;
    --paper-2:    #eceee9;
    --ink:        #1b2a2e;
    --ink-2:      #56646a;
    --ink-3:      #7c888c;
    --rule:       #d9dcd6;
    --rule-soft:  #e6e8e2;
    --field:      #fbfbf9;
    --accent:     #175c6c;
    --accent-ink: #0d4150;
    --trend:      #3d7a4e;
    --oneday:     #8a7a52;
    --fresh:      #b0672a;
    --focus:      #175c6c;
    --shadow:     0 1px 2px rgba(27,42,46,.05), 0 6px 20px rgba(27,42,46,.06);

    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans:  "IBM Plex Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --mono:  "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:      #14191b;
      --paper-2:    #191f21;
      --ink:        #e8eae5;
      --ink-2:      #9aa6a5;
      --ink-3:      #7a8685;
      --rule:       #2b3336;
      --rule-soft:  #222a2c;
      --field:      #1c2325;
      --accent:     #63c1cf;
      --accent-ink: #8ad4de;
      --trend:      #6fb682;
      --oneday:     #c2ad7d;
      --fresh:      #e0975b;
      --focus:      #63c1cf;
      --shadow:     0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --paper:      #14191b;
    --paper-2:    #191f21;
    --ink:        #e8eae5;
    --ink-2:      #9aa6a5;
    --ink-3:      #7a8685;
    --rule:       #2b3336;
    --rule-soft:  #222a2c;
    --field:      #1c2325;
    --accent:     #63c1cf;
    --accent-ink: #8ad4de;
    --trend:      #6fb682;
    --oneday:     #c2ad7d;
    --fresh:      #e0975b;
    --focus:      #63c1cf;
    --shadow:     0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 18px;
    line-height: 1.62;
    font-optical-sizing: auto;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 24%, transparent); }
  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a:hover { color: var(--accent-ink); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }

  .shell { display: grid; grid-template-columns: 190px minmax(0, 1fr); min-height: 100vh; }

  /* ---------- rail ---------- */
  .rail {
    border-right: 1px solid var(--rule);
    padding: 26px 18px 40px;
    position: sticky; top: 0; align-self: start;
    height: 100vh; overflow-y: auto;
    font-family: var(--sans);
  }
  .rail-flag {
    font-family: var(--serif); font-weight: 600; font-size: 21px;
    letter-spacing: .01em; line-height: 1.15; color: var(--ink);
    margin-bottom: 2px;
  }
  .rail-flag span { display: block; }
  .rail-sub {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--ink-3); margin-bottom: 22px;
  }
  .rail-group-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-3);
    margin: 20px 0 8px;
  }
  .rail a.navlink, .rail button.navlink {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    width: 100%; text-align: left;
    font-family: var(--sans); font-size: 12.5px; line-height: 1.35;
    color: var(--ink-2); text-decoration: none;
    background: none; border: 0; cursor: pointer;
    padding: 5px 0; border-bottom: 1px solid var(--rule-soft);
  }
  .rail a.navlink:hover, .rail button.navlink:hover { color: var(--accent); }
  .rail .navlink.active { color: var(--ink); font-weight: 600; }
  .rail .navlink .ct {
    font-family: var(--mono); font-size: 10px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .rail-views { display: flex; flex-direction: column; gap: 2px; }
  .rail-views .navlink { border-bottom: 0; padding: 7px 0; font-size: 13px; }

  /* ---------- main ---------- */
  .main { padding: 30px clamp(20px, 5vw, 64px) 120px; }
  .col { max-width: 720px; margin: 0 auto; }
  .fade { animation: fade .32s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } * { transition: none !important; } }

  /* masthead */
  .masthead { text-align: center; padding-bottom: 18px; margin-bottom: 26px; }
  .flag {
    font-family: var(--serif); font-weight: 600;
    font-size: clamp(34px, 6vw, 52px); line-height: 1.02;
    letter-spacing: -.015em; margin: 0 0 12px; text-wrap: balance;
  }
  .flag-rule { border: 0; height: 0; border-top: 3px solid var(--accent);
    border-bottom: 1px solid var(--accent); padding-bottom: 3px; margin: 0 0 10px; }
  .dateline {
    font-family: var(--mono); font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-2);
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
  }
  .dateline .sep { color: var(--ink-3); }
  .dispatch {
    font-family: var(--serif); font-style: italic; font-size: 17px;
    color: var(--ink-2); max-width: 56ch; margin: 16px auto 0; text-wrap: pretty;
  }
  .archive-flag {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--fresh);
    border: 1px solid var(--fresh); border-radius: 2px;
    padding: 3px 8px; display: inline-block; margin-top: 12px;
  }

  /* need to know */
  .ntk { margin: 0 0 44px; border-top: 3px solid var(--ink);
    border-bottom: 1px solid var(--rule); padding: 16px 0 4px; }
  .ntk h2 {
    font-family: var(--mono); font-size: 11px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--ink-2); margin: 0 0 12px; font-weight: 500;
  }
  .ntk ul { list-style: none; margin: 0; padding: 0; }
  .ntk li {
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    padding: 10px 0 10px 22px; border-bottom: 1px solid var(--rule-soft);
    position: relative;
  }
  .ntk li:last-child { border-bottom: 0; }
  .ntk li::before {
    content: "—"; position: absolute; left: 0; color: var(--accent);
    font-family: var(--serif);
  }

  /* section */
  .section { margin: 0 0 40px; scroll-margin-top: 20px; }
  .section-head {
    display: flex; align-items: baseline; gap: 12px;
    border-bottom: 2px solid var(--ink); padding-bottom: 7px; margin-bottom: 4px;
  }
  .section-kicker {
    font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
    color: var(--ink-3); white-space: nowrap;
  }
  .section-title {
    font-family: var(--serif); font-weight: 600; font-size: 21px;
    margin: 0; flex: 1; letter-spacing: -.01em;
  }
  .section-scope {
    font-family: var(--sans); font-size: 12px; color: var(--ink-2);
    margin: 8px 0 14px; max-width: 60ch;
  }

  /* story (list form) */
  .story { padding: 18px 0; border-bottom: 1px solid var(--rule); }
  .story:last-child { border-bottom: 0; }
  .story.lead { padding-top: 6px; }
  .story-head { cursor: pointer; display: block; }
  .story.brief .story-head { cursor: default; }
  .headline {
    font-family: var(--serif); font-weight: 600; letter-spacing: -.012em;
    color: var(--ink); margin: 0; text-wrap: balance; line-height: 1.16;
    font-size: 22px;
  }
  .story.lead .headline { font-size: clamp(27px, 4.4vw, 35px); }
  .story.brief .headline { font-size: 17px; font-family: var(--sans); font-weight: 600; letter-spacing: 0; line-height: 1.3; }
  button.story-head { background: none; border: 0; padding: 0; width: 100%; text-align: left; }
  button.story-head:hover .headline { color: var(--accent); }
  .dek {
    font-family: var(--serif); font-style: italic; font-size: 17px;
    color: var(--ink-2); margin: 7px 0 0; text-wrap: pretty;
  }
  .story.brief .dek { font-family: var(--sans); font-style: normal; font-size: 13.5px; margin-top: 3px; }
  .story-meta {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-top: 10px;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .badge {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em;
    text-transform: uppercase; padding: 2px 6px; border-radius: 2px;
    border: 1px solid currentColor; white-space: nowrap;
  }
  .badge.trend  { color: var(--trend); }
  .badge.one_day{ color: var(--oneday); }
  .badge.new    { color: var(--fresh); }
  .expand-hint {
    font-family: var(--mono); font-size: 10px; color: var(--accent);
    letter-spacing: .08em;
  }

  /* analysis panel */
  .analysis { overflow: hidden; }
  .analysis-inner {
    border-top: 1px solid var(--rule); margin-top: 16px; padding-top: 18px;
  }
  .block { margin: 0 0 18px; }
  .block > .label {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--accent);
    margin: 0 0 5px; font-weight: 500;
  }
  .block > p { margin: 0; font-size: 17px; line-height: 1.6; }
  .qs { margin: 0; padding: 0; list-style: none; }
  .qs li {
    font-family: var(--sans); font-size: 14.5px; line-height: 1.5;
    padding: 7px 0 7px 26px; position: relative; border-bottom: 1px solid var(--rule-soft);
  }
  .qs li:last-child { border-bottom: 0; }
  .qs li::before {
    counter-increment: q; content: "Q" counter(q);
    position: absolute; left: 0; top: 7px;
    font-family: var(--mono); font-size: 10px; color: var(--ink-3);
  }
  .qs { counter-reset: q; }
  .sources { font-family: var(--mono); font-size: 11px; color: var(--ink-2);
    margin-top: 14px; line-height: 1.7; }
  .sources a { display: inline; }
  .confidence {
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-3);
  }

  /* POV panel */
  .pov {
    background: var(--field); border-top: 2px solid var(--accent);
    box-shadow: var(--shadow);
    padding: 18px 18px 16px; margin: 22px 0 6px; border-radius: 0 0 3px 3px;
  }
  .pov h4 {
    font-family: var(--mono); font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--accent); margin: 0 0 10px; font-weight: 500;
  }
  .pov-prompts { margin: 0 0 14px; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 6px; }
  .pov-prompts li {
    font-family: var(--serif); font-style: italic; font-size: 14.5px;
    color: var(--ink-2); padding-left: 16px; position: relative;
  }
  .pov-prompts li::before { content: "›"; position: absolute; left: 2px; color: var(--accent); font-style: normal; }
  .pov textarea {
    width: 100%; min-height: 84px; resize: vertical;
    font-family: var(--sans); font-size: 14px; line-height: 1.55;
    color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 3px; padding: 10px;
  }
  .pov textarea::placeholder { color: var(--ink-3); }
  .pov-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  button.btn {
    font-family: var(--sans); font-size: 12.5px; font-weight: 500;
    color: var(--paper); background: var(--accent); border: 1px solid var(--accent);
    border-radius: 3px; padding: 7px 13px; cursor: pointer;
  }
  button.btn:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  button.btn.ghost { color: var(--accent); background: none; }
  button.btn.ghost:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  button.btn:disabled { opacity: .5; cursor: default; }
  .pov-saved { font-family: var(--mono); font-size: 10px; color: var(--trend);
    text-transform: uppercase; letter-spacing: .08em; }

  .notes { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .note {
    border-left: 2px solid var(--rule); padding: 2px 0 2px 12px;
  }
  .note .note-date {
    font-family: var(--mono); font-size: 10px; color: var(--ink-3);
    letter-spacing: .06em; text-transform: uppercase;
  }
  .note .note-body { font-family: var(--sans); font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; }

  .ask-out {
    margin-top: 12px; border-top: 1px dashed var(--rule); padding-top: 12px;
    font-family: var(--serif); font-size: 15px; line-height: 1.6; white-space: pre-wrap;
  }
  .ask-out .ask-tag {
    display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px;
  }

  /* threads */
  .thread-group-label {
    font-family: var(--mono); font-size: 11px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-2);
    border-bottom: 2px solid var(--ink); padding-bottom: 6px; margin: 34px 0 4px;
  }
  .thread-row {
    width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
    padding: 15px 0; border-bottom: 1px solid var(--rule);
    display: flex; flex-direction: column; gap: 5px;
  }
  .thread-row:hover .thread-title { color: var(--accent); }
  .thread-title { font-family: var(--serif); font-weight: 600; font-size: 19px; color: var(--ink); margin: 0; }
  .thread-sum { font-family: var(--sans); font-size: 13.5px; color: var(--ink-2); margin: 0; }
  .thread-row .story-meta { margin-top: 3px; }

  .timeline { list-style: none; margin: 18px 0 0; padding: 0; }
  .timeline li {
    position: relative; padding: 0 0 20px 26px;
    border-left: 1px solid var(--rule); margin-left: 5px;
  }
  .timeline li:last-child { border-left-color: transparent; padding-bottom: 4px; }
  .timeline li::before {
    content: ""; position: absolute; left: -4.5px; top: 5px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--paper); border: 2px solid var(--accent);
  }
  .timeline .tl-date {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .timeline .tl-note { font-family: var(--serif); font-size: 15.5px; margin: 3px 0 0; }

  .back {
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--accent);
    background: none; border: 0; cursor: pointer; padding: 0; margin-bottom: 20px;
  }
  .back:hover { color: var(--accent-ink); }

  /* archive */
  .arch-row {
    width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
    padding: 14px 0; border-bottom: 1px solid var(--rule);
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  }
  .arch-row:hover .arch-lead { color: var(--accent); }
  .arch-date { font-family: var(--mono); font-size: 11px; color: var(--ink-3);
    letter-spacing: .05em; white-space: nowrap; }
  .arch-lead { font-family: var(--serif); font-size: 16px; color: var(--ink); flex: 1; }
  .arch-ct { font-family: var(--mono); font-size: 10px; color: var(--ink-3); white-space: nowrap; }

  /* states */
  .state {
    max-width: 460px; margin: 12vh auto 0; text-align: center;
  }
  .state h2 { font-family: var(--serif); font-weight: 500; font-size: 24px; margin: 0 0 10px; }
  .state p { font-family: var(--sans); font-size: 14px; color: var(--ink-2); }
  .spinner {
    width: 22px; height: 22px; border: 2px solid var(--rule); border-top-color: var(--accent);
    border-radius: 50%; margin: 0 auto 20px; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--ink); color: var(--paper);
    font-family: var(--sans); font-size: 13px;
    padding: 9px 16px; border-radius: 3px; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50;
  }
  .toast.show { opacity: 1; }

  /* responsive */
  @media (max-width: 820px) {
    .shell { grid-template-columns: 1fr; }
    .rail {
      position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule);
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px; padding: 18px 20px 24px;
    }
    .rail-head { grid-column: 1 / -1; }
    .rail-sections { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
    .rail-views { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .rail-views .navlink { border: 1px solid var(--rule); border-radius: 3px; padding: 6px 12px; }
    body { font-size: 17px; }
  }
</style>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections and views">
    <div class="rail-head">
      <div class="rail-flag"><span>The CMT</span><span>Briefing</span></div>
      <div class="rail-sub">Comms · Media · Tech · High-Tech</div>
    </div>
    <div class="rail-sections">
      <div class="rail-group-label">Today's edition</div>
      <div id="railSections"></div>
    </div>
    <div class="rail-views">
      <div class="rail-group-label">Desk</div>
      <button class="navlink" data-view="today">Today</button>
      <button class="navlink" data-view="threads">Threads &amp; storylines</button>
      <button class="navlink" data-view="archive">Archive</button>
    </div>
  </nav>

  <main class="main">
    <div class="col" id="view"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var SECTION_META = {
    top_stories:               { title: "Top Stories" },
    need_to_know:              { title: "What I Need to Know Today" },
    high_tech:                 { title: "High-Tech Industry" },
    comms_media:               { title: "Communications & Media" },
    semiconductors:            { title: "Semiconductors" },
    ai_emerging:               { title: "AI & Emerging Technology" },
    manufacturing_ops:         { title: "Manufacturing & Operations" },
    supply_chain:              { title: "Supply Chain" },
    datacenter_infra:          { title: "Data Center & Infrastructure" },
    companies_moves:           { title: "Major Companies & Competitive Moves" },
    challenges_opportunities:  { title: "Industry Challenges & Opportunities" },
    research_thought_leadership:{ title: "Research & Thought Leadership" },
    consultant_lens:           { title: "What Consultants Should Be Thinking About" }
  };
  var ANALYSIS_ORDER = [
    ["what_happened", "What happened"],
    ["why_it_matters", "Why it matters"],
    ["whats_changing", "What's changing"],
    ["business_implications", "Business implications"],
    ["operational_supply_chain", "Operations & supply chain"],
    ["ai_tech_disruption", "AI & technology disruption"],
    ["opportunities_risks", "Opportunities & risks"]
  ];

  var S = {
    db: null, sample: null,
    view: "today",
    date: null, liveDate: null,
    edition: null, stories: {},
    threads: null, archive: null,
    viewingArchive: false
  };

  var viewEl = document.getElementById("view");
  var railSectionsEl = document.getElementById("railSections");
  var toastEl = document.getElementById("toast");
  var toastT = null;

  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) {
      if (c == null) return;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return e;
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove("show"); }, 2600);
  }
  function fmtDate(iso, opts) {
    var d = new Date(iso + "T12:00:00");
    if (isNaN(d)) return iso;
    return d.toLocaleDateString("en-US", opts || { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  }
  function fmtShort(iso) { return fmtDate(iso, { month: "short", day: "numeric", year: "numeric" }); }
  function sectionTitle(slug) { return (SECTION_META[slug] && SECTION_META[slug].title) || slug; }
  function threadKey(item) { return item.thread_ref ? "thread:" + item.thread_ref : "story:" + item.story_id; }

  function badge(status) {
    if (!status) return null;
    var label = status === "one_day" ? "One-day story" : status === "trend" ? "Developing trend" : "New thread";
    return h("span", { class: "badge " + status, text: label });
  }

  // ---------- boot ----------
  function boot() {
    renderState("loading");
    if (!window.claude || !window.claude.use) { renderState("nodb"); return; }
    window.claude.use("db").then(function (db) {
      if (!db) { renderState("nodb"); return; }
      S.db = db;
      window.claude.use("sample").then(function (sm) { S.sample = sm || null; }).catch(function () {});
      watchLatest();
      loadLatest();
    }).catch(function () { renderState("nodb"); });
  }

  function watchLatest() {
    try {
      S.db.doc("meta/latest").onSnapshot(function (snap) {
        if (!snap.exists) return;
        var d = snap.data().date;
        S.liveDate = d;
        if (!S.viewingArchive && d && d !== S.date) loadLatest();
      }, function () {});
    } catch (e) {}
  }

  function loadLatest() {
    S.db.doc("meta/latest").get().then(function (snap) {
      if (!snap.exists || !snap.data().date) { renderState("empty"); return; }
      S.viewingArchive = false;
      loadEdition(snap.data().date);
    }).catch(function () { renderState("error"); });
  }

  function loadEdition(date) {
    renderState("loading");
    var edP = S.db.doc("editions/" + date).get();
    var stP = S.db.collection("editions/" + date + "/stories").get();
    Promise.all([edP, stP]).then(function (r) {
      if (!r[0].exists) { renderState("empty"); return; }
      S.date = date;
      S.edition = r[0].data();
      S.stories = {};
      r[1].docs.forEach(function (d) { S.stories[d.id] = d.data(); });
      S.threads = null; S.archive = null;
      if (S.view === "today") renderToday();
      else route(S.view);
      buildRailSections();
    }).catch(function () { renderState("error"); });
  }

  // ---------- rail ----------
  function buildRailSections() {
    clear(railSectionsEl);
    if (!S.edition) return;
    (S.edition.sections || []).forEach(function (sec) {
      var n = (sec.items || []).length;
      var isNtk = sec.slug === "need_to_know";
      var count = isNtk ? (S.edition.need_to_know || []).length : n;
      if (!count && !isNtk) return;
      var a = h("a", {
        class: "navlink", href: "#sec-" + sec.slug,
        onclick: function () { setView("today"); }
      }, [
        h("span", { text: sectionTitle(sec.slug) }),
        h("span", { class: "ct", text: String(count) })
      ]);
      railSectionsEl.appendChild(a);
    });
  }

  document.getElementById("rail").addEventListener("click", function (e) {
    var b = e.target.closest("button.navlink[data-view]");
    if (b) setView(b.getAttribute("data-view"));
  });

  function setView(v) {
    S.view = v;
    document.querySelectorAll(".rail-views .navlink").forEach(function (n) {
      n.classList.toggle("active", n.getAttribute("data-view") === v);
    });
    route(v);
    window.scrollTo(0, 0);
  }
  function route(v) {
    if (v === "today") renderToday();
    else if (v === "threads") renderThreads();
    else if (v === "archive") renderArchive();
  }

  // ---------- states ----------
  function renderState(kind) {
    clear(viewEl);
    var box = h("div", { class: "state fade" });
    if (kind === "loading") {
      box.appendChild(h("div", { class: "spinner" }));
      box.appendChild(h("p", { text: "Opening the briefing room…" }));
    } else if (kind === "empty") {
      box.appendChild(h("h2", { text: "Today's edition is being compiled" }));
      box.appendChild(h("p", { text: "The overnight run curates and analyses the day's developments across communications, media, technology and high-tech. Check back shortly." }));
    } else if (kind === "nodb") {
      box.appendChild(h("h2", { text: "The archive is offline" }));
      box.appendChild(h("p", { text: "This briefing needs its live data store, which isn't available in the current view. Open the published artifact while signed in to your workspace." }));
    } else {
      box.appendChild(h("h2", { text: "Couldn't load the edition" }));
      box.appendChild(h("p", { text: "Something went wrong reading the archive. Refresh to try again." }));
    }
    viewEl.appendChild(box);
  }

  // ---------- today ----------
  function renderToday() {
    clear(viewEl);
    var ed = S.edition;
    if (!ed) { renderState("empty"); return; }
    var wrap = h("div", { class: "fade" });

    var m = ed.masthead || {};
    var mast = h("header", { class: "masthead" }, [
      h("h1", { class: "flag", text: m.title || "The CMT Briefing" }),
      h("hr", { class: "flag-rule" }),
      h("div", { class: "dateline" }, datelineParts(ed))
    ]);
    if (m.dispatch) mast.appendChild(h("p", { class: "dispatch", text: m.dispatch }));
    if (S.viewingArchive) mast.appendChild(h("div", { class: "archive-flag", text: "Archived edition — " + fmtShort(S.date) }));
    wrap.appendChild(mast);

    var ntk = ed.need_to_know || [];
    if (ntk.length) {
      wrap.appendChild(h("section", { class: "ntk", id: "sec-need_to_know" }, [
        h("h2", { text: "What I need to know today" }),
        h("ul", {}, ntk.map(function (b) { return h("li", { text: b }); }))
      ]));
    }

    (ed.sections || []).forEach(function (sec, si) {
      if (sec.slug === "need_to_know") return;
      var items = sec.items || [];
      if (!items.length) return;
      var secEl = h("section", { class: "section", id: "sec-" + sec.slug }, [
        h("div", { class: "section-head" }, [
          h("span", { class: "section-kicker", text: "§ " + pad(si + 1) }),
          h("h2", { class: "section-title", text: sectionTitle(sec.slug) })
        ])
      ]);
      if (sec.scope) secEl.appendChild(h("p", { class: "section-scope", text: sec.scope }));
      items.forEach(function (item, ii) {
        secEl.appendChild(storyEl(item, sec.slug === "top_stories" && ii === 0));
      });
      wrap.appendChild(secEl);
    });

    viewEl.appendChild(wrap);
  }

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function datelineParts(ed) {
    var m = ed.masthead || {};
    var parts = [];
    if (m.volume_label) parts.push(m.volume_label);
    parts.push(m.edition_label || fmtDate(ed.date));
    var out = [];
    parts.forEach(function (p, i) {
      if (i) out.push(h("span", { class: "sep", text: "·" }));
      out.push(document.createTextNode(p));
    });
    return out;
  }

  function storyEl(item, isLead) {
    var deep = item.type === "deep";
    var cls = "story" + (isLead ? " lead" : "") + (deep ? "" : " brief");
    var st = h("div", { class: cls });

    var meta = h("div", { class: "story-meta" }, [
      publisherLine(item.sources),
      badge(item.thread_status),
      deep ? h("span", { class: "expand-hint", text: "Read the analysis ↓" }) : null
    ]);

    var headInner = [
      h(isLead ? "h3" : "h3", { class: "headline", text: item.headline }),
      item.dek ? h("p", { class: "dek", text: item.dek }) : null,
      meta
    ];

    if (deep) {
      var panel = h("div", { class: "analysis", style: "max-height:0" });
      var btn = h("button", {
        class: "story-head", "aria-expanded": "false",
        onclick: function () { toggleAnalysis(btn, panel, item); }
      }, headInner);
      st.appendChild(btn);
      st.appendChild(panel);
    } else {
      var head = h("div", { class: "story-head" }, headInner);
      st.appendChild(head);
    }
    return st;
  }

  function publisherLine(sources) {
    var names = (sources || []).map(function (s) { return s.publisher; }).filter(Boolean);
    if (!names.length) return document.createTextNode("");
    var uniq = names.filter(function (v, i) { return names.indexOf(v) === i; });
    var txt = uniq.slice(0, 3).join(" · ");
    if (uniq.length > 3) txt += " +" + (uniq.length - 3);
    return h("span", { text: txt });
  }

  function toggleAnalysis(btn, panel, item) {
    var open = btn.getAttribute("aria-expanded") === "true";
    if (open) {
      panel.style.maxHeight = panel.scrollHeight + "px";
      requestAnimationFrame(function () { panel.style.maxHeight = "0"; });
      btn.setAttribute("aria-expanded", "false");
      var hint = btn.querySelector(".expand-hint");
      if (hint) hint.textContent = "Read the analysis ↓";
      return;
    }
    if (!panel.dataset.built) {
      panel.appendChild(buildAnalysis(item));
      panel.dataset.built = "1";
    }
    panel.style.maxHeight = panel.scrollHeight + "px";
    btn.setAttribute("aria-expanded", "true");
    var hint2 = btn.querySelector(".expand-hint");
    if (hint2) hint2.textContent = "Close ↑";
    setTimeout(function () { if (btn.getAttribute("aria-expanded") === "true") panel.style.maxHeight = "none"; }, 260);
  }

  function buildAnalysis(item) {
    var full = S.stories[item.story_id] || item;
    var a = full.analysis || {};
    var inner = h("div", { class: "analysis-inner" });

    ANALYSIS_ORDER.forEach(function (pair) {
      var v = a[pair[0]];
      if (!v || !String(v).trim()) return;
      inner.appendChild(h("div", { class: "block" }, [
        h("p", { class: "label", text: pair[1] }),
        h("p", { text: v })
      ]));
    });

    if (a.exec_questions && a.exec_questions.length) {
      inner.appendChild(h("div", { class: "block" }, [
        h("p", { class: "label", text: "Questions for the C-suite" }),
        h("ul", { class: "qs" }, a.exec_questions.map(function (q) { return h("li", { text: q }); }))
      ]));
    }

    if (a.trend_note && a.trend_note.trim()) {
      inner.appendChild(h("div", { class: "block" }, [
        h("p", { class: "label", text: "How this connects" }),
        h("p", { text: a.trend_note })
      ]));
      if (item.thread_ref) {
        inner.appendChild(h("button", {
          class: "back", text: "Follow this storyline →",
          onclick: function () { setView("threads"); openThread(item.thread_ref); }
        }));
      }
    }

    var src = (full.sources || item.sources || []);
    if (src.length) {
      var sEl = h("div", { class: "sources" }, [h("span", { text: "Sources: " })]);
      src.forEach(function (s, i) {
        if (i) sEl.appendChild(document.createTextNode("  ·  "));
        sEl.appendChild(h("a", { href: s.url, target: "_blank", rel: "noopener", text: s.publisher || s.title || s.url }));
      });
      if (full.confidence) sEl.appendChild(h("div", { class: "confidence", text: "Corroboration: " + full.confidence }));
      inner.appendChild(sEl);
    }

    inner.appendChild(povPanel(full, a));
    return inner;
  }

  // ---------- POV ----------
  function povPanel(item, a) {
    var key = threadKey(item);
    var prompts = (a && a.develop_your_pov && a.develop_your_pov.length) ? a.develop_your_pov : [
      "What does this mean for the industry?",
      "What does it mean for the companies involved?",
      "What are the operational or supply-chain implications?",
      "What could AI or new technology change here?",
      "What opportunity or risk does this create?",
      "What would I tell a client about this?"
    ];
    var wrap = h("div", { class: "pov" }, [
      h("h4", { text: "Develop your point of view" }),
      h("ul", { class: "pov-prompts" }, prompts.map(function (p) { return h("li", { text: p }); }))
    ]);

    var ta = h("textarea", { placeholder: "Write your take. What's your through-line? Where do you disagree with the consensus?" });
    var savedTag = h("span", { class: "pov-saved", text: "", style: "display:none" });
    var saveBtn = h("button", { class: "btn", text: "Save to this storyline" });
    var notesEl = h("div", { class: "notes" });

    saveBtn.addEventListener("click", function () {
      var text = ta.value.trim();
      if (!text) return;
      saveBtn.disabled = true;
      addNote(key, text).then(function () {
        ta.value = "";
        savedTag.textContent = "Saved"; savedTag.style.display = "";
        setTimeout(function () { savedTag.style.display = "none"; }, 2000);
        loadNotes(key, notesEl);
      }).catch(function () { toast("Couldn't save — the store didn't accept the write."); })
        .then(function () { saveBtn.disabled = false; });
    });

    var actions = h("div", { class: "pov-actions" }, [saveBtn, savedTag]);
    if (S.sample) {
      actions.appendChild(askBtn("Pressure-test my take", "pressure", item, a, ta));
      actions.appendChild(askBtn("Steel-man the opposite", "counter", item, a, ta));
      actions.appendChild(askBtn("Quiz me", "quiz", item, a, ta));
    }
    var askOut = h("div", { class: "ask-out", style: "display:none" });

    wrap.appendChild(ta);
    wrap.appendChild(actions);
    wrap.appendChild(askOut);
    wrap.appendChild(notesEl);
    wrap._askOut = askOut;
    loadNotes(key, notesEl);
    return wrap;
  }

  function askBtn(label, mode, item, a, ta) {
    var b = h("button", { class: "btn ghost", text: label });
    b.addEventListener("click", function () {
      var out = b.closest(".pov")._askOut;
      out.style.display = "";
      clear(out);
      out.appendChild(h("span", { class: "ask-tag", text: label + " — thinking…" }));
      var body = h("div", { text: "" });
      out.appendChild(body);
      var ctl = new AbortController();
      var prompt = buildAskPrompt(mode, item, a, ta.value.trim());
      b.disabled = true;
      S.sample(prompt, {
        signal: ctl.signal,
        modelTier: mode === "quiz" ? "default" : "complex",
        onText: function (u) { body.textContent = u.text; out.firstChild.textContent = label; }
      }).catch(function (e) {
        if (e.code === "cancelled") return;
        body.textContent = e.text || "";
        out.firstChild.textContent = label + " — unavailable (" + (e.code || "error") + ")";
      }).then(function () { b.disabled = false; });
    });
    return b;
  }

  function buildAskPrompt(mode, item, a, myTake) {
    var ctx = "You are a sparring partner for a management consultant building a point of view on the "
      + "communications, media, technology and high-tech industries.\n\n"
      + "STORY: " + item.headline + "\n"
      + (item.dek ? item.dek + "\n" : "");
    ANALYSIS_ORDER.forEach(function (p) { if (a[p[0]]) ctx += "\n" + p[1] + ": " + a[p[0]]; });
    ctx += "\n\nTHEIR CURRENT TAKE:\n" + (myTake || "(they haven't written one yet)") + "\n\n";
    if (mode === "pressure") ctx += "Pressure-test their take. Where is it weak, unsupported, or conventional? What would a skeptical partner push back on? Be direct and specific. 150 words max.";
    else if (mode === "counter") ctx += "Give the strongest good-faith argument against their take (or against the obvious read, if they have no take yet). Steel-man it. 150 words max.";
    else ctx += "Ask me 4 sharp questions that would test whether I really understand this story and its implications well enough to advise a client. Just the questions, numbered.";
    return ctx;
  }

  function povDocRef(key) {
    var safe = key.replace(/[^a-zA-Z0-9_.~:@+-]/g, "-");
    return S.db.doc("pov/" + safe);
  }
  function addNote(key, text) {
    var ref = povDocRef(key);
    return ref.get().then(function (snap) {
      var entries = (snap.exists && snap.data().entries) || [];
      entries.push({ date: new Date().toISOString().slice(0, 10), text: text });
      var body = { entries: entries, key: key, updated_at: new Date().toISOString() };
      return snap.exists ? ref.update(body) : ref.set(body);
    });
  }
  function loadNotes(key, el) {
    clear(el);
    povDocRef(key).get().then(function (snap) {
      if (!snap.exists) return;
      var entries = (snap.data().entries || []).slice().reverse();
      entries.forEach(function (n) {
        el.appendChild(h("div", { class: "note" }, [
          h("div", { class: "note-date", text: fmtShort(n.date) }),
          h("div", { class: "note-body", text: n.text })
        ]));
      });
    }).catch(function () {});
  }

  // ---------- threads ----------
  function renderThreads() {
    clear(viewEl);
    renderState("loading");
    var q;
    try { q = S.db.collection("threads").orderBy("last_seen", "desc").limit(300).get(); }
    catch (e) { q = S.db.collection("threads").get(); }
    q.then(function (snap) {
      S.threads = snap.docs.map(function (d) { var o = d.data(); o.slug = o.slug || d.id; return o; });
      S.threads.sort(function (x, y) { return (y.last_seen || "").localeCompare(x.last_seen || ""); });
      drawThreadList();
    }).catch(function () { renderState("error"); });
  }

  function drawThreadList() {
    clear(viewEl);
    var wrap = h("div", { class: "fade" });
    wrap.appendChild(h("header", { class: "masthead" }, [
      h("h1", { class: "flag", text: "Threads & Storylines", style: "font-size:clamp(28px,5vw,40px)" }),
      h("hr", { class: "flag-rule" }),
      h("div", { class: "dateline" }, [document.createTextNode("Follow a development across editions — tell a one-day story from a trend")])
    ]));
    if (!S.threads || !S.threads.length) {
      wrap.appendChild(h("p", { class: "section-scope", text: "No storylines yet. They accumulate as editions publish." }));
      viewEl.appendChild(wrap); return;
    }
    var groups = [["trend", "Developing trends"], ["new", "Newly opened"], ["one_day", "One-day stories"]];
    groups.forEach(function (g) {
      var rows = S.threads.filter(function (t) { return (t.status || "one_day") === g[0]; });
      if (!rows.length) return;
      wrap.appendChild(h("div", { class: "thread-group-label", text: g[1] + "  (" + rows.length + ")" }));
      rows.forEach(function (t) {
        wrap.appendChild(h("button", { class: "thread-row", onclick: function () { openThread(t.slug); } }, [
          h("h3", { class: "thread-title", text: t.title || t.slug }),
          t.summary ? h("p", { class: "thread-sum", text: t.summary }) : null,
          h("div", { class: "story-meta" }, [
            h("span", { text: sectionTitle(t.section) }),
            h("span", { class: "sep", text: "·" }),
            h("span", { text: (t.timeline ? t.timeline.length : 0) + " entries" }),
            h("span", { class: "sep", text: "·" }),
            h("span", { text: "last " + (t.last_seen ? fmtShort(t.last_seen) : "—") })
          ])
        ]));
      });
    });
    viewEl.appendChild(wrap);
  }

  function openThread(slug) {
    if (S.view !== "threads") setView("threads");
    var render = function () {
      var t = (S.threads || []).filter(function (x) { return x.slug === slug; })[0];
      if (!t) { S.db.doc("threads/" + slug).get().then(function (s) {
        if (s.exists) { var o = s.data(); o.slug = o.slug || slug; S.threads = (S.threads || []).concat([o]); drawThread(o); }
        else drawThreadList();
      }); return; }
      drawThread(t);
    };
    if (S.threads) render(); else renderThreads(), setTimeout(render, 400);
  }

  function drawThread(t) {
    clear(viewEl);
    var wrap = h("div", { class: "fade" });
    wrap.appendChild(h("button", { class: "back", text: "← All storylines", onclick: drawThreadList }));
    wrap.appendChild(h("header", { class: "masthead", style: "text-align:left" }, [
      h("h1", { class: "flag", text: t.title || t.slug, style: "font-size:clamp(26px,4.5vw,36px)" }),
      h("div", { class: "story-meta", style: "justify-content:flex-start" }, [
        badge(t.status),
        h("span", { text: sectionTitle(t.section) }),
        h("span", { class: "sep", text: "·" }),
        h("span", { text: "opened " + (t.first_seen ? fmtShort(t.first_seen) : "—") })
      ])
    ]));
    if (t.summary) wrap.appendChild(h("p", { class: "dispatch", style: "margin-left:0;text-align:left", text: t.summary }));

    var tl = (t.timeline || []).slice().sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    if (tl.length) {
      wrap.appendChild(h("p", { class: "label", style: "font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin:26px 0 0" , text: "Timeline" }));
      wrap.appendChild(h("ul", { class: "timeline" }, tl.map(function (e) {
        return h("li", {}, [
          h("div", { class: "tl-date", text: fmtShort(e.date || e.edition_date) }),
          h("p", { class: "tl-note", text: e.note })
        ]);
      })));
    }

    var notesEl = h("div", { class: "notes" });
    var ta = h("textarea", { placeholder: "Your evolving view on this storyline…" });
    var saveBtn = h("button", { class: "btn", text: "Add to my POV" });
    saveBtn.addEventListener("click", function () {
      var v = ta.value.trim(); if (!v) return;
      saveBtn.disabled = true;
      addNote("thread:" + t.slug, v).then(function () {
        ta.value = ""; loadNotes("thread:" + t.slug, notesEl); toast("Added to your point of view");
      }).catch(function () { toast("Couldn't save."); }).then(function () { saveBtn.disabled = false; });
    });
    var pov = h("div", { class: "pov" }, [
      h("h4", { text: "My point of view on this storyline" }),
      ta, h("div", { class: "pov-actions" }, [saveBtn]), notesEl
    ]);
    loadNotes("thread:" + t.slug, notesEl);
    wrap.appendChild(pov);
    viewEl.appendChild(wrap);
    window.scrollTo(0, 0);
  }

  // ---------- archive ----------
  function renderArchive() {
    clear(viewEl);
    renderState("loading");
    S.db.collection("editions").orderBy("date", "desc").limit(120).get().then(function (snap) {
      var rows = snap.docs.map(function (d) { return d.data(); }).filter(function (e) { return e && e.date; });
      drawArchive(rows);
    }).catch(function () {
      S.db.collection("editions").get().then(function (snap) {
        var rows = snap.docs.map(function (d) { return d.data(); }).filter(function (e) { return e && e.date; });
        rows.sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
        drawArchive(rows);
      }).catch(function () { renderState("error"); });
    });
  }

  function drawArchive(rows) {
    clear(viewEl);
    var wrap = h("div", { class: "fade" });
    wrap.appendChild(h("header", { class: "masthead" }, [
      h("h1", { class: "flag", text: "Archive", style: "font-size:clamp(28px,5vw,40px)" }),
      h("hr", { class: "flag-rule" }),
      h("div", { class: "dateline" }, [document.createTextNode(rows.length + " editions")])
    ]));
    rows.forEach(function (e) {
      var lead = "";
      var count = 0;
      (e.sections || []).forEach(function (s) {
        (s.items || []).forEach(function (it) { count++; if (!lead && s.slug === "top_stories") lead = it.headline; });
      });
      wrap.appendChild(h("button", { class: "arch-row", onclick: function () { S.viewingArchive = true; setView("today"); loadEdition(e.date); } }, [
        h("span", { class: "arch-date", text: fmtShort(e.date) }),
        h("span", { class: "arch-lead", text: lead || (e.masthead && e.masthead.dispatch) || "—" }),
        h("span", { class: "arch-ct", text: count + " items" })
      ]));
    });
    if (S.viewingArchive) {
      wrap.appendChild(h("button", { class: "btn ghost", text: "Back to today's edition", style: "margin-top:20px",
        onclick: function () { S.viewingArchive = false; setView("today"); loadLatest(); } }));
    }
    viewEl.appendChild(wrap);
  }

  boot();
})();
</script>
