# Curated RSS/Atom feeds. `fetch_rss.py` pulls every feed here, tags each item
# with `section_hint`, and skips (with a logged warning) any feed that is dead,
# moved, or returns junk. Prune dead feeds and add good ones over time - the
# daily workflow's "lessons learned" section tracks feed health.
#
# section_hint is a soft signal only; the agent decides final placement.
# Google News query-based discovery lives in queries.yaml, not here.

feeds:
  # ---- Broad technology industry ----
  - url: https://www.theverge.com/rss/index.xml
    source: The Verge
    section_hint: high_tech
  - url: https://feeds.arstechnica.com/arstechnica/index
    source: Ars Technica
    section_hint: high_tech
  - url: https://www.theregister.com/headlines.atom
    source: The Register
    section_hint: high_tech
  - url: https://techcrunch.com/feed/
    source: TechCrunch
    section_hint: high_tech
  - url: https://www.wired.com/feed/category/business/latest/rss
    source: Wired Business
    section_hint: high_tech
  - url: https://www.technologyreview.com/feed/
    source: MIT Technology Review
    section_hint: ai_emerging

  # ---- AI & emerging tech ----
