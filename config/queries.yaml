# Query-based discovery. Two consumers:
#
#   google_news:  fetch_rss.py turns each string into
#                 https://news.google.com/rss/search?q=<query>%20when:<window>
#                 This is the resilient backbone - no API key, broad coverage.
#
#   web_search:   the agent runs these as WebSearch queries in the daily
#                 workflow for recency-ranked results and to catch what RSS
#                 misses (analyst notes, primary announcements, paywalled outlets).
#
# `window` is the Google News recency window (1d, 2d, 7d). Keep queries specific
# enough to return signal, broad enough to catch the unexpected.

default_window: 2d

sections:
  top_stories:
    google_news:
      - CMT industry technology media telecom
      - technology industry major announcement
    web_search:
      - biggest technology industry news this week
      - major telecom media technology developments today

